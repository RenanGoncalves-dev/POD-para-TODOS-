<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<title>POD</title>
<style>
:root{--bg:#0f0f12;--card:#1a1a20;--card2:#23232b;--red:#ff4d4d;--mut:#8b8b98}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#f1f1f4;font:15px/1.35 system-ui,sans-serif;padding-bottom:170px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h1 span{color:var(--red)}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.box{background:var(--card);border-radius:20px;padding:14px;margin:14px 0}
form{display:flex;flex-direction:column;gap:10px}
input[type=text],input:not([type]){width:100%;padding:14px;border-radius:14px;border:1px solid #33333d;background:var(--card2);color:#fff;font-size:15px;outline:none}
input:focus{border-color:var(--red)}
button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--card2);color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
form button{background:var(--red);padding:14px;font-size:16px;border-radius:14px}
button.ok{background:#1f6f3a}button.ic{width:40px;height:40px;padding:0;border-radius:50%;font-size:16px}
button.play{background:var(--red)}
#tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0 12px;padding-bottom:2px}
.tab{white-space:nowrap;background:var(--card);color:var(--mut);border-radius:999px;padding:10px 16px}
.tab.on{background:var(--red);color:#fff}
.ep{display:flex;gap:12px;padding:10px;margin-bottom:10px;background:var(--card);border-radius:18px;align-items:center}
.ep.on{background:#2a1a1e}
.ep img{width:72px;height:72px;object-fit:cover;border-radius:14px;background:var(--card2);flex:none}
.i{flex:1;min-width:0}
.t{font-weight:600;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s{font-size:12px;color:var(--mut);margin-top:3px}
.a{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.a .row{display:flex;gap:6px}
details{margin-top:10px}summary{color:var(--mut);font-size:13px;cursor:pointer}
details .box{margin:8px 0}details button{margin:4px 4px 0 0;font-size:13px}
#player{position:fixed;bottom:0;left:0;right:0;background:#202028;border-radius:24px 24px 0 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #000a}
#player .in{max-width:720px;margin:0 auto}
#pt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
audio{width:100%;height:40px;color-scheme:dark}
.ctl{display:flex;gap:8px;margin-top:8px;justify-content:space-between}
.ctl button{flex:1;font-size:13px}.ctl button.sel{background:var(--red)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🎧 <span>POD</span></h1><div class="sub">Seus podcasts, offline, de graça</div></header>
<div class="box">
<form id="f"><input id="u" placeholder="Cole o link do vídeo, playlist ou canal" required><button>⬇ Baixar em <span id="dest"></span></button></form>
<div class="s" id="net"></div>
<details><summary>💾 Armazenamento / cartão de memória</summary>
<div class="box"><div class="s" id="st"></div><div id="cards"></div>
<button id="scan">🔄 Reconhecer arquivos da pasta</button>
<button id="imp">📥 Importar do cartão do celular</button>
<input type="file" id="file" accept="audio/*,.m4a,.opus,.webm" multiple hidden></div></details>
</div>
<div id="tabs"></div>
<main id="list"></main>
</div>
<div id="player" hidden><div class="in"><div id="pt"></div>
<audio id="au" controls></audio>
<div class="ctl"><button data-r="1">1x</button><button data-r="1.25">1.25x</button><button data-r="1.5">1.5x</button><button data-r="1.75">1.75x</button><button data-r="2">2x</button></div></div></div>
<script src="app.js"></script>
</body></html>
