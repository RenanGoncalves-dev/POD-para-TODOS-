name: Build & Release (Android APK + Linux AppImage + Windows EXE)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: POD-Linux-x86_64.AppImage
            out: dist-desktop/POD-Linux-x86_64.AppImage
          - os: windows-latest
            artifact: POD-Windows.exe
            out: dist-desktop/POD-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r desktop/requirements.txt
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
      - name: Publicar na Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk dist/POD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: POD-Android-APK
          path: dist/POD.apk
      - name: Publicar APK na Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/POD.apk
          generate_release_notes: true
