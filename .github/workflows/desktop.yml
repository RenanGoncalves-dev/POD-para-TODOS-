name: Desktop (Linux + Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r desktop/requirements.txt
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: POD-${{ matrix.os }}
          path: dist-desktop/*
      - name: Anexar à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/*

